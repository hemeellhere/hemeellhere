<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<meta name="theme-color" content="#090909" />
<meta name="color-scheme" content="dark" />
<meta name="robots" content="noindex, nofollow" />
<title>404 — Frame Not Found | MAXXY.MOV</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  @font-face {
    font-family: 'Space Grotesk';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url('/fonts/space-grotesk-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'DM Sans';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url('/fonts/dm-sans-latin.woff2') format('woff2');
  }
  :root {
    --bg: #090909;
    --fg: #f1f1ec;
    --accent: #c7ff3d;
    --line: #252525;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 32px 5vw;
  }
  .brand {
    font: 700 20px/1 'Space Grotesk', sans-serif;
    letter-spacing: -0.06em;
    color: var(--fg);
    text-decoration: none;
  }
  .brand span { color: var(--accent); }
  main {
    max-width: 640px;
    margin: auto 0;
  }
  .code {
    font: 600 12px/1 'Space Grotesk', sans-serif;
    letter-spacing: 0.18em;
    color: var(--accent);
    margin-bottom: 24px;
  }
  h1 {
    font: 600 clamp(44px, 8vw, 84px)/0.88 'Space Grotesk', sans-serif;
    letter-spacing: -0.06em;
    margin: 0 0 24px;
    text-transform: uppercase;
  }
  h1 em {
    font-style: normal;
    color: var(--accent);
  }
  p {
    color: #a0a09b;
    font-size: 16px;
    line-height: 1.6;
    margin: 0 0 40px;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #090909;
    padding: 14px 24px;
    font: 700 11px/1 'Space Grotesk', sans-serif;
    letter-spacing: 0.1em;
    text-decoration: none;
    text-transform: uppercase;
    transition: transform 0.2s, background 0.2s;
  }
  .back-btn:hover {
    transform: translateY(-2px);
    background: #fff;
  }
  .back-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
  }
  footer {
    border-top: 1px solid var(--line);
    padding-top: 20px;
    font: 10px 'Space Grotesk', sans-serif;
    letter-spacing: 0.1em;
    color: #8a8a8a;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
  <header>
    <a href="/" class="brand">MAXXY<span>.MOV</span></a>
  </header>
  <main>
    <div class="code">404 // FRAME NOT FOUND</div>
    <h1>Cut from the <em>timeline.</em></h1>
    <p>The sequence or cut you're looking for doesn't exist, was moved, or was trimmed in the final export.</p>
    <a href="/" class="back-btn">Back to timeline &rarr;</a>
  </main>
  <footer>
    <span>MAXXY.MOV</span>
    <span>EDITED FOR RETENTION</span>
  </footer>
</body>
</html>
